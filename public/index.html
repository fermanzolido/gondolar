<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuánto Sale</title>
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="v-search">
  <header class="bar no-print">
    <div class="bar-in">
      <a class="brand" href="#" data-go="search" aria-label="Cuánto Sale, inicio">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3" fill="currentColor"/></svg>
        <span>Cuánto Sale</span>
      </a>
      <nav class="nav" aria-label="Secciones">
        <button data-go="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
        <button data-go="plan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Mi compra <span id="cartCount" class="count" data-n="0"></span></button>
        <button data-go="trip"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg><span>Viaje<span class="lg"> y tiendas</span></span></button>
      </nav>
      <span id="barNote" class="bar-note mute"></span>
    </div>
  </header>

  <div class="app no-print">
    <div id="banner" class="banner" role="status" hidden></div>
    <div class="layout">
      <main id="view"></main>
      <aside class="side" id="side" aria-label="Tu lista"></aside>
    </div>
  </div>

  <div class="dock no-print" id="dock"></div>
  <div id="printArea" class="print-only"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="optimizer.js"></script>
  <script src="app.js"></script>
</body>
</html>
