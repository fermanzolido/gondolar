name: Publicar la web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Apuntar la web a tu API (variable API_BASE del repositorio)
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e 'require("fs").writeFileSync("public/config.js", "window.CONFIG = " + JSON.stringify({ API_BASE: process.env.API_BASE || "" }) + ";\n")'
          cat public/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
