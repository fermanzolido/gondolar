name: Publicar la web (GitHub Pages)

# Se ejecuta con cada cambio en main y todos los días a las 17:30 UTC (14:30 en Argentina), cuando SEPA ya publicó los datos.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruebas
        run: |
          npm test
          python test/test_build_sepa.py

      - name: Descargar y procesar los datos abiertos de SEPA (Precios Claros)
        run: python scripts/build_sepa.py --download --out public/data

      - name: Apuntar la web a tu API (variable API_BASE del repositorio)
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e 'require("fs").writeFileSync("public/config.js", "window.CONFIG = " + JSON.stringify({ API_BASE: process.env.API_BASE || "" }) + ";\n")'
          cat public/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
