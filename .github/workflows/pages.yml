name: Publicar la web (GitHub Pages)

# Se ejecuta con cada cambio en main y cuando se actualizan los datos.
# Los datos de precios NO se descargan acá: el portal oficial de datos abiertos rechaza (403) las conexiones desde los
# servidores de GitHub. Los procesa y sube scripts/publish_datos.py, desde una computadora con IP argentina, como
# adjunto del release "datos"; después le pide a este flujo que republique la web.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruebas
        run: |
          npm test
          python test/test_build_sepa.py

      - name: Traer los datos de precios ya procesados (release "datos")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download datos --pattern datos.tar.gz --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          tar -xzf "$RUNNER_TEMP/datos.tar.gz" -C public
          ls -la public/data | head
          node -e 'const m=require("./public/data/meta.json"); console.log("Datos de SEPA del", m.fecha, "-", m.productos, "productos"); if(!m.fecha||m.productos<40000) process.exit(1)'

      - name: Apuntar la web a tu API (variable API_BASE del repositorio)
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node -e 'require("fs").writeFileSync("public/config.js", "window.CONFIG = " + JSON.stringify({ API_BASE: process.env.API_BASE || "" }) + ";\n")'
          cat public/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
