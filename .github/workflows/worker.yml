name: Publicar la API (Cloudflare Worker)

# Opcional. Solo actúa si cargaste los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en el repositorio.
# Si preferís, podés publicar el Worker a mano con `npx wrangler deploy` (ver README).
on:
  push:
    branches: [main]
    paths: ['worker/**', 'lib/**', 'wrangler.toml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Aviso si faltan los secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "Sin CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: no se publica la API desde acá."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
