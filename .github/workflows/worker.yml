name: Publicar la API (Cloudflare Worker)

# Opcional: si preferís, podés publicar el Worker a mano con `npx wrangler deploy` (ver README).
on:
  push:
    branches: [main]
    paths: ['worker/**', 'lib/**', 'wrangler.toml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
